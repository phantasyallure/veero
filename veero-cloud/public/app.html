<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Administration — Veero</title><link rel="icon" href="/static/favicon.png"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png"><script src="/static/brand.js"></script><script src="/static/download.js"></script><script src="/static/hse.js"></script><meta name="theme-color" content="#102D50"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/site.css">
<style>
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}.kp .card{padding:14px}.kp b{font-size:26px;letter-spacing:-.03em;display:block}.kp span{font-size:12px;color:var(--mute)}
.tbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.t{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 16px;position:relative;overflow:hidden}.t::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c,#c9d4e0)}
.t b{display:block}.t small{color:var(--mute)}.t em{font:700 24px inherit;font-style:normal;letter-spacing:-.03em;display:block;margin-top:4px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);text-align:left;padding:8px 10px}td{padding:10px;border-top:1px solid var(--line)}
td select{padding:6px 8px}.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(16,45,80,.09);color:var(--a2)}.chip.ok{background:#e3f3ea;color:var(--ok)}
.bar{height:6px;border-radius:9px;background:rgba(16,45,80,.12);margin-top:5px}.bar i{display:block;height:100%;border-radius:9px;background:var(--a1)}
.hb{display:flex;align-items:flex-end;gap:3px;height:70px}.hb i{flex:1;background:var(--a1);border-radius:3px 3px 0 0;min-height:2px}.hl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:4px}
body{background:radial-gradient(900px 420px at 90% -8%,#cfeeed,transparent 70%),radial-gradient(700px 400px at -5% 30%,#e4f6f5,transparent 70%),var(--bg)}
.hero2{background:linear-gradient(135deg,#1a4a7c,#0a1f38);color:#fff;border-radius:22px;padding:24px 28px;margin-bottom:18px;box-shadow:0 24px 50px -28px rgba(16,45,80,.8);position:relative;overflow:hidden}
.hero2::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero2 h1{font-size:25px;letter-spacing:-.02em}.hero2 p{opacity:.85;margin-top:4px}
.tabs{background:#fff;box-shadow:0 6px 20px -12px rgba(16,45,80,.5)}.tabs button.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;box-shadow:none}
.card{transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-2px)}
.kp .card{padding:16px}.kp b{font-size:30px}.ic{font-style:normal;display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#d6f0ef,#bfe9e6);margin-bottom:10px;font-size:19px;color:var(--a2)}
.rk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-size:12px;font-weight:700;margin-right:7px}.card h2{margin-bottom:12px}.bar{height:9px}.bar i{background:linear-gradient(90deg,var(--a1),#00b8b0)}
.hb{height:90px}.hb i{background:linear-gradient(180deg,#00b8b0,var(--a2))}
.demo{background:#fff6dd;border:1px solid #f0d58a;color:#7a5a00;border-radius:12px;padding:9px 14px;margin-top:14px;font-size:13px}
#v>*{animation:up .35s ease both}#v.still>*{animation:none}@keyframes up{from{opacity:0;transform:translateY(8px)}}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.row label{flex:1;min-width:150px}code{background:#e6edf5;padding:3px 8px;border-radius:7px;font-weight:700}
.dc h2{display:flex;align-items:center;gap:8px}.rk2{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 12px;margin-top:9px}
.rk2 small{display:block;color:var(--mute)}.rk2 .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.rk2 em{font:700 20px inherit;font-style:normal;font-variant-numeric:tabular-nums}
.chip.bad{background:#fde8e6;color:var(--bad)}.chip.warn{background:#fff3df;color:var(--amber)}.chip.hse{background:#fff0dc;color:#b36200}.chip.quality{background:#dff5f3;color:#00817b}
.calm2{color:var(--ok);margin-top:12px;font-weight:600}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;margin-top:16px}
.tbs .t.risk::before{background:var(--c)}.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font:600 13px inherit;cursor:pointer;color:var(--mute)}.seg button.on{background:var(--navy);color:#fff}
.ban{border-radius:12px;padding:10px 14px;margin-top:14px;font-size:14px}.ban.bad{background:#fde8e6;color:var(--bad)}.ban.warn{background:#fff3df;color:var(--amber)}.ban.ok{background:#e3f3ea;color:var(--ok)}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.hint{color:var(--mute);font-size:12.5px;margin-top:4px}
textarea{font:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}pre.rep{white-space:pre-wrap;font:inherit;background:#f4f7fa;border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.7}
.hb2{display:flex;gap:2px;align-items:flex-end;height:90px}.hb2 i{flex:1;border-radius:3px 3px 0 0;min-height:2px;background:linear-gradient(180deg,#00b8b0,var(--a2))}
.mg{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.mg .who{flex:1;min-width:180px}
@media print{.hdr,.tabs,.no-print{display:none!important}}
</style></head>
<body><header class="hdr"><a class="brand" href="/"><img src="/static/emblem.png" alt="" onerror="this.remove()"><b id="bn">…</b></a><span class="chip" id="bt"></span><span class="sp"></span><a class="btn sm" id="dlh" href="#" download style="margin-right:8px">Télécharger l’app</a><button class="btn ghost sm" id="out">Déconnexion</button></header>
<main class="wrap" style="padding-top:24px"><div class="hero2" id="hr"><h1>Bonjour</h1><p>HSE et qualité de votre site en un coup d’œil.</p></div><div class="tabs" id="tb" style="max-width:640px"><button data-t="room" class="on">Vue d’ensemble</button><button data-t="reg">Registre</button><button data-t="rep">Rapports</button><button data-t="mgr">Responsables</button><button data-t="acc">Compte</button></div><div id="v"></div></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),mm=s=>{s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const api=async(op,body)=>{const r=await fetch("/api?op="+op,body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(r.status===401){location.href="/";throw 0}if(!r.ok){const j=await r.json().catch(()=>({}));const e=new Error(j.error||"err");e.status=r.status;throw e}return r.headers.get("content-type").includes("json")?r.json():r.text()};
const SV={eye:'<circle cx="12" cy="12" r="3"/><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/>',alert:'<path d="M12 4.5L2.8 20h18.4z"/><path d="M12 10v4M12 17.2v.1"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',bell:'<path d="M6 9a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21h4"/>',check:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',cal:'<rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',fire:'<path d="M12 3s5 4.5 5 9a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3 1-5 1-8z"/>',drop:'<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>',up:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',users:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/>'},I=n=>`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${SV[n]}</svg>`;
const TYPES={industry:"Industrie / usine",food:"Agroalimentaire / restauration collective",logistics:"Logistique / entrepôt",construction:"BTP / chantier",other:"Autre"},DL={hse:"HSE",quality:"Qualité"},DCOL={hse:"#b36200",quality:"#00817b"},DICO={hse:"🔥",quality:"🧼"};
const lvl=l=>l==="critical"?"#b3261e":"#d98a1b",fd=d=>d?new Date(d+"T00:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"}):"—",today=()=>HSE.ymd(new Date());
(()=>{const a=document.getElementById("dlh"),u=(window.VEERO_DOWNLOAD||{}).url;if(u)a.href=u;else{a.removeAttribute("href");a.removeAttribute("download");a.textContent="App Windows : bientôt disponible";a.style.opacity=".55";a.style.pointerEvents="none"}})();
let PAIR="";const getPair=async()=>{if(!PAIR){try{PAIR=(await api("m_pair")).code||""}catch{}}return PAIR};const cp=t=>{try{navigator.clipboard.writeText(t)}catch{}};
let ME,tab="room",timer,note="",MGR=null,lastRoom="";
function morph(a,b){const A=[...a.childNodes],B=[...b.childNodes];B.forEach((nb,i)=>{const na=A[i];if(!na){a.appendChild(nb.cloneNode(true));return}if(na.nodeType!==nb.nodeType||na.nodeName!==nb.nodeName){a.replaceChild(nb.cloneNode(true),na);return}if(nb.nodeType===3){if(na.nodeValue!==nb.nodeValue)na.nodeValue=nb.nodeValue;return}[...na.attributes].forEach(x=>{if(!nb.hasAttribute(x.name))na.removeAttribute(x.name)});[...nb.attributes].forEach(x=>{if(na.getAttribute(x.name)!==x.value)na.setAttribute(x.name,x.value)});morph(na,nb)});while(a.childNodes.length>B.length)a.removeChild(a.lastChild)}
const paint=h=>{const v=$("#v");if(h===lastRoom)return;const first=lastRoom==="";lastRoom=h;v.classList.toggle("still",!first);if(first){v.innerHTML=h;return}const t=document.createElement("div");t.innerHTML=h;morph(v,t)};
const kpis=a=>`<div class="kp">${a.map(([l,v,ic])=>`<div class="card"><i class="ic">${I(ic)}</i><b>${v}</b><span>${l}</span></div>`).join("")}</div>`;
async function loadMgr(){try{const l=await api("m_staff");MGR={};l.forEach(m=>{MGR[m.role]=m})}catch{MGR={}}}

/* ---------- Vue d'ensemble ---------- */
const riskRow=r=>`<div class="rk2" style="--c:${lvl(r.level)}"><div><b>${esc(HSE.riskLabel(r.type,"fr"))}</b><small>${esc(r.zone)}${r.camera?" · "+esc(r.camera):""}${r.detail?" · "+esc(r.detail):""}</small></div><div class="rt"><em>${mm(r.seconds)}</em>${r.ack?'<span class="chip ok">✓ pris en charge</span>':r.level==="critical"?'<span class="chip bad">Critique</span>':""}</div></div>`;
async function room(){
  let s;try{s=await api("m_state")}catch{return}if(tab!=="room")return;if(!MGR)await loadMgr();if(tab!=="room")return;
  if(s.waiting&&!s.zones){const D=window.VEERO_DOWNLOAD||{};return paint(`<div class="card" style="margin-top:16px"><h2>En attente de votre système caméra</h2><p class="muted">Vos zones et vos risques apparaîtront ici dès que le système sera installé et connecté. Installez l’application sur l’ordinateur de votre site, puis entrez cet identifiant, ce code d’appairage et l’adresse IP de la caméra :</p><p style="margin-top:12px">Identifiant : <code>${esc(ME.restaurant_id)}</code></p><p style="margin-top:8px">Code d’appairage : <code>${esc(await getPair()||"…")}</code></p>${D.url?`<p style="margin-top:16px"><a class="btn" href="${esc(D.url)}" download>Télécharger l’application pour Windows</a></p>`:""}<p class="muted" style="margin-top:16px">En attendant, vous pouvez déjà remplir le <b>Registre</b> et nommer vos <b>Responsables</b>.</p></div>`)}
  const k=s.kpi||{},rs=s.risks||[],due=s.due||{soon:0,expired:0},dn=(due.soon||0)+(due.expired||0);
  const sort=a=>[...a].sort((x,y)=>(y.level==="critical")-(x.level==="critical")||y.seconds-x.seconds);
  const dom=d=>{const l=sort(rs.filter(r=>r.domain===d)),m=MGR&&MGR[d];return`<div class="card dc" style="border-top:4px solid ${DCOL[d]}"><h2>${DICO[d]} ${DL[d]} <span class="chip ${l.length?(l.some(r=>r.level==="critical")?"bad":"warn"):"ok"}">${l.length}</span></h2><p class="muted" style="font-size:13px;margin-bottom:4px">Responsable : ${m?esc(m.name):"<i>non nommé</i>"}</p>${l.length?l.map(riskRow).join(""):'<p class="calm2">✓ Aucun risque en cours</p>'}</div>`};
  const zn=(s.zones||[]).map(z=>{const n=rs.filter(r=>r.zone===z.name).length,c=z.state==="risk"?lvl(z.level):"#17704a";return`<div class="t risk" style="--c:${c}"><b>${esc(z.name)}</b><small>${z.domain?esc(DL[z.domain]||"HSE + Qualité"):""}</small><em style="color:${c}">${z.state==="risk"?n+" risque"+(n>1?"s":""):"OK"}</em></div>`}).join("");
  const rv=(s.resolved||[]).slice(0,6).map(w=>`<p style="margin-top:9px"><span class="chip ${w.domain}">${DL[w.domain]||""}</span> <b>${esc(HSE.riskLabel(w.type,"fr"))}</b> <span class="muted">· ${esc(w.zone)} · traité en ${mm(w.seconds)}${w.responder?" par "+esc(w.responder):""}</span></p>`).join("");
  paint(`${dn?`<div class="ban ${due.expired?"bad":"warn"}">⏰ Registre : ${due.expired?due.expired+" échéance(s) dépassée(s)":""}${due.expired&&due.soon?" · ":""}${due.soon?due.soon+" à venir":""} — <a href="#" id="gr" style="font-weight:700">ouvrir le registre</a></div>`:""}
  ${kpis([["Risques en cours",k.open??rs.length,"eye"],["Critiques",k.critical??rs.filter(r=>r.level==="critical").length,"alert"],["Traitement moyen",k.avg_response!=null?mm(k.avg_response):"–","clock"],["Échéances registre",dn,"cal"]])}
  <div class="two">${dom("hse")}${dom("quality")}</div>
  ${zn?`<div class="card" style="margin-top:16px"><h2>Zones surveillées</h2><div class="tbs">${zn}</div></div>`:""}
  <div class="card" style="margin-top:16px"><h2>Derniers traitements</h2>${rv||'<p class="muted">Rien pour l’instant.</p>'}</div>`);
  const g=$("#gr");if(g)g.onclick=e=>{e.preventDefault();go("reg")};
}

/* ---------- Registre (saisie manuelle) ---------- */
let ASSETS=[],edit=null,rf={d:"all",s:"all"},regErr="";
const ST={expired:["bad","Expiré"],soon:["warn","Bientôt"],ok:["ok","OK"]};
async function reg(){try{ASSETS=await api("m_assets");regErr=""}catch(e){ASSETS=[];regErr=e&&e.status===503?"La table du registre n’existe pas encore : exécutez supabase.sql dans Supabase (SQL Editor).":"Impossible de charger le registre."}if(tab==="reg")paintReg()}
function catOpts(d,sel){return HSE.assetsOf(d).map(k=>`<option value="${k}" ${k===sel?"selected":""}>${esc(HSE.assetLabel(k,"fr"))}</option>`).join("")}
function form(){const a=edit,isNew=!a.id;return`<div class="card no-print" style="margin-top:16px" id="fm"><h2>${isNew?"Ajouter au registre":"Modifier"}</h2><div class="g3">
 <label>Domaine<select id="f_d"><option value="hse" ${a.domain==="hse"?"selected":""}>🔥 HSE</option><option value="quality" ${a.domain==="quality"?"selected":""}>🧼 Qualité</option></select></label>
 <label>Type<select id="f_c">${catOpts(a.domain,a.category)}</select></label>
 <label>Nom / désignation<input id="f_n" maxlength="80" value="${esc(a.name)}" placeholder="ex. Extincteur CO2 n°12"></label>
 <label>Emplacement<input id="f_l" maxlength="80" value="${esc(a.location)}" placeholder="ex. Atelier 2, porte nord"></label>
 <label>N° de série / de lot<input id="f_r" maxlength="60" value="${esc(a.ref)}"></label>
 <label>Date d’échéance<input id="f_e" type="date" value="${esc(a.expires_on)}"></label>
 <label>Dernier contrôle<input id="f_k" type="date" value="${esc(a.last_check||"")}"></label>
 <label>Prévenir X jours avant<input id="f_m" type="number" min="0" max="730" value="${a.remind_days}"></label></div>
 <p class="hint" id="f_h">${esc(HSE.assetHint(a.category,"fr"))}${HSE.assetHint(a.category,"fr")?" ":""}Durée suggérée, à adapter à votre fournisseur et à la réglementation de votre site.</p>
 <label style="display:block;margin-top:10px">Notes<textarea id="f_o" rows="2" maxlength="300">${esc(a.notes)}</textarea></label>
 <p class="err" id="f_err"></p><div class="row" style="margin-top:10px"><button class="btn" id="f_ok">Enregistrer</button><button class="btn ghost" id="f_no">Annuler</button></div></div>`}
function newAsset(d="hse"){const c=HSE.assetsOf(d)[0];return{domain:d,category:c,name:HSE.assetLabel(c,"fr"),location:"",ref:"",expires_on:HSE.addDays(today(),HSE.assetDays(c)),last_check:today(),remind_days:30,notes:""}}
function wireForm(){
  const g=id=>$("#"+id);
  g("f_d").onchange=e=>{edit=newAsset(e.target.value);paintReg();g("fm").scrollIntoView({behavior:"smooth"})};
  g("f_c").onchange=e=>{const c=e.target.value;if(!edit.id){g("f_n").value=HSE.assetLabel(c,"fr");g("f_e").value=HSE.addDays(today(),HSE.assetDays(c))}g("f_h").textContent=(HSE.assetHint(c,"fr")+" Durée suggérée, à adapter à votre fournisseur et à la réglementation de votre site.").trim()};
  g("f_no").onclick=()=>{edit=null;paintReg()};
  g("f_ok").onclick=async()=>{const b={id:edit.id,domain:g("f_d").value,category:g("f_c").value,name:g("f_n").value,location:g("f_l").value,ref:g("f_r").value,expires_on:g("f_e").value,last_check:g("f_k").value,remind_days:g("f_m").value,notes:g("f_o").value};
    if(b.name.trim().length<2||!b.expires_on){g("f_err").textContent="Indiquez un nom et une date d’échéance.";return}
    g("f_ok").disabled=true;try{await api("m_asset_save",b);edit=null;await reg()}catch(e){g("f_err").textContent=e.status===503?"La table du registre n’existe pas encore : exécutez supabase.sql dans Supabase.":"Enregistrement impossible.";g("f_ok").disabled=false}}}
function paintReg(){
  const ex=ASSETS.filter(a=>a.state==="expired").length,so=ASSETS.filter(a=>a.state==="soon").length;
  const list=ASSETS.filter(a=>(rf.d==="all"||a.domain===rf.d)&&(rf.s==="all"||(rf.s==="due"?a.state!=="ok":a.state===rf.s))).sort((a,b)=>a.days-b.days);
  $("#v").innerHTML=`${regErr?`<div class="ban bad">${esc(regErr)}</div>`:""}${ex||so?`<div class="ban ${ex?"bad":"warn"}">${ex?ex+" élément(s) expiré(s)":""}${ex&&so?" · ":""}${so?so+" à échéance proche":""}</div>`:ASSETS.length?'<div class="ban ok">✓ Aucune échéance proche.</div>':""}
  <div class="row no-print" style="margin-top:16px"><button class="btn" id="ad">+ Ajouter</button><div class="seg" id="sd">${[["all","Tous"],["hse","HSE"],["quality","Qualité"]].map(([k,l])=>`<button data-k="${k}" class="${rf.d===k?"on":""}">${l}</button>`).join("")}</div><div class="seg" id="ss">${[["all","Tout"],["due","À traiter"],["expired","Expirés"]].map(([k,l])=>`<button data-k="${k}" class="${rf.s===k?"on":""}">${l}</button>`).join("")}</div><span class="sp"></span><button class="btn ghost sm" id="csv">Exporter CSV</button></div>
  ${edit?form():""}
  <div class="card" style="margin-top:16px;overflow:auto"><table><tr><th>Élément</th><th>Domaine</th><th>Emplacement</th><th>Échéance</th><th>Statut</th><th class="no-print"></th></tr>${list.map(a=>`<tr><td><b>${esc(a.name)}</b><br><span class="muted" style="font-size:12px">${esc(HSE.assetLabel(a.category,"fr"))}${a.ref?" · "+esc(a.ref):""}</span></td><td><span class="chip ${a.domain}">${DL[a.domain]}</span></td><td>${esc(a.location||"—")}</td><td>${fd(a.expires_on)}<br><span class="muted" style="font-size:12px">${a.days<0?"depuis "+(-a.days)+" j":a.days===0?"aujourd’hui":"dans "+a.days+" j"}</span></td><td><span class="chip ${ST[a.state][0]}">${ST[a.state][1]}</span></td><td class="no-print" style="white-space:nowrap"><button class="btn ghost sm" data-rn="${a.id}" title="Contrôle fait : repousse l’échéance de la durée suggérée">Renouveler</button> <button class="btn ghost sm" data-ed="${a.id}">Modifier</button> <button class="btn red sm" data-dl="${a.id}">Supprimer</button></td></tr>`).join("")||`<tr><td colspan="6" class="muted">${ASSETS.length?"Aucun élément pour ce filtre.":"Le registre est vide. Ajoutez vos extincteurs, lots, étalonnages, certificats… avec leur date d’échéance."}</td></tr>`}</table></div>`;
  $("#ad").onclick=()=>{edit=newAsset(rf.d==="quality"?"quality":"hse");paintReg();$("#fm").scrollIntoView({behavior:"smooth"})};
  $("#sd").querySelectorAll("button").forEach(b=>b.onclick=()=>{rf.d=b.dataset.k;paintReg()});$("#ss").querySelectorAll("button").forEach(b=>b.onclick=()=>{rf.s=b.dataset.k;paintReg()});
  $("#csv").onclick=()=>{const q=v=>`"${String(v??"").replace(/"/g,'""')}"`,rows=[["nom","type","domaine","emplacement","reference","echeance","jours_restants","statut","dernier_controle","notes"],...list.map(a=>[a.name,HSE.assetLabel(a.category,"fr"),a.domain,a.location,a.ref,a.expires_on,a.days,a.state,a.last_check||"",a.notes])];const u=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download="registre-veero-"+today()+".csv";a.click();URL.revokeObjectURL(u)};
  document.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{edit={...ASSETS.find(a=>a.id===b.dataset.ed)};paintReg();$("#fm").scrollIntoView({behavior:"smooth"})});
  document.querySelectorAll("[data-rn]").forEach(b=>b.onclick=async()=>{const a=ASSETS.find(x=>x.id===b.dataset.rn);if(!confirm("Contrôle effectué ? L’échéance sera repoussée au "+fd(HSE.addDays(today(),HSE.assetDays(a.category)))+"."))return;try{await api("m_asset_save",{...a,last_check:today(),expires_on:HSE.addDays(today(),HSE.assetDays(a.category))});await reg()}catch{alert("Impossible pour l’instant.")}});
  document.querySelectorAll("[data-dl]").forEach(b=>b.onclick=async()=>{if(!confirm("Supprimer cet élément du registre ?"))return;try{await api("m_asset_del",{id:b.dataset.dl});await reg()}catch{alert("Impossible pour l’instant.")}});
  if(edit)wireForm()}

/* ---------- Rapports ---------- */
const demoData=()=>{const H=Array.from({length:24},(_,h)=>h>=7&&h<=17?4+(h*7)%9:h>=18&&h<=22?2:0);return{kpi:{detected:128,hse:71,quality:57,critical:9,resolved:119,escalated:6,avg_resolution:310},days:Array.from({length:7},(_,i)=>({day:"Jour "+(i+1),hse:8+i%4*3,quality:6+i%3*3,critical:i%3,resolved:14+i})),hours:H,peak_hour:11,types:[["hse","no_ppe",24],["quality","dirt",19],["hse","spill",15],["quality","hygiene_ppe",14],["hse","fire",3]].map(([domain,type,count])=>({domain,type,count})),zones:[["Atelier 2",41],["Conditionnement",33],["Quai de chargement",22],["Cuisine",18]].map(([name,count])=>({name,count})),quiet:["Bureau"],responders:[{name:"Samir",domain:"hse",resolved:66,avg_response:240},{name:"Lina",domain:"quality",resolved:53,avg_response:390}]}};
let REPTXT="";
async function rep(d=30,demo=false){
  const r=demo?demoData():await api("m_report&days="+d);if(tab!=="rep")return;const k=r.kpi,m=n=>n==null?"–":mm(n),hm=Math.max(1,...r.hours),mx=(a,f)=>Math.max(1,...a.map(f));
  const bars=(a,f,g,badge)=>a.map(x=>`<p style="margin-top:11px">${badge?`<span class="chip ${x.domain}">${DL[x.domain]||""}</span> `:""}<b>${esc(x.label||x.name||x.day)}</b> <span class="muted">· ${g(x)}</span><span class="bar"><i style="width:${100*f(x)/mx(a,f)}%"></i></span></p>`).join("");
  $("#v").innerHTML=`<div class="row no-print" style="margin-top:16px"><button class="btn ghost" id="dm">${demo?"Quitter l’exemple":"Voir un exemple"}</button><label style="max-width:220px">Période<select id="pd">${[[7,"7 derniers jours"],[30,"30 derniers jours"],[90,"90 derniers jours"]].map(([v,l])=>`<option value="${v}" ${v===d?"selected":""}>${l}</option>`).join("")}</select></label><span class="sp"></span><button class="btn" id="rd">Rapport du jour</button><button class="btn" id="rm">Rapport du mois</button></div>
  <div id="txt"></div>${demo?`<div class="demo">Aperçu avec des données d’exemple : ce ne sont pas vos chiffres.</div>`:""}
  ${kpis([["Risques détectés",k.detected,"eye"],["dont HSE",k.hse,"fire"],["dont Qualité",k.quality,"drop"],["Critiques",k.critical,"alert"],["Résolus",k.resolved,"check"],["Traitement moyen",m(k.avg_resolution),"clock"],["Escalades à l’administration",k.escalated,"bell"],["Heure de pointe",r.peak_hour==null?"–":r.peak_hour+"h","up"]])}
  <div class="two"><div class="card"><h2>Risques les plus fréquents</h2>${bars(r.types.slice(0,8).map(t=>({...t,label:HSE.riskLabel(t.type,"fr")})),x=>x.count,x=>x.count+" fois",1)||'<p class="muted">Rien pour l’instant.</p>'}</div>
  <div class="card"><h2>Zones les plus exposées</h2>${bars(r.zones.slice(0,8),x=>x.count,x=>x.count+" risques")||'<p class="muted">Rien pour l’instant.</p>'}${r.quiet.length?`<p style="margin-top:14px"><b>Sans incident :</b> ${r.quiet.map(n=>`<span class="chip">${esc(n)}</span>`).join(" ")}</p>`:""}</div></div>
  <div class="card" style="margin-top:16px"><h2>Détections par heure</h2><div class="hb2">${r.hours.map((h,i)=>`<i style="height:${100*h/hm}%" title="${i}h : ${h}"></i>`).join("")}</div><div class="hl"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>23h</span></div></div>
  <div class="two"><div class="card"><h2>Détections par jour</h2>${bars([...r.days].reverse().map(x=>({...x,n:x.hse+x.quality})),x=>x.n,x=>`${x.hse} HSE · ${x.quality} qualité · ${x.critical} critique(s) · ${x.resolved} résolus`)||'<p class="muted">Rien pour l’instant.</p>'}</div>
  <div class="card"><h2>Traitement par responsable</h2>${bars(r.responders,x=>x.resolved,x=>`${x.resolved} traités · ${m(x.avg_response)} en moyenne`,1)||'<p class="muted">Rien pour l’instant.</p>'}</div></div>`;
  $("#pd").onchange=e=>rep(+e.target.value,demo);$("#dm").onclick=()=>rep(d,!demo);
  const show=async p=>{try{REPTXT=await api("m_report_text&period="+p+"&lang=fr");$("#txt").innerHTML=`<div class="card" style="margin-top:16px"><pre class="rep">${esc(REPTXT)}</pre><div class="row no-print"><button class="btn ghost sm" id="cpt">Copier</button><button class="btn ghost sm" id="prt">Imprimer</button></div></div>`;$("#cpt").onclick=()=>{cp(REPTXT);$("#cpt").textContent="Copié"};$("#prt").onclick=()=>print()}catch{$("#txt").innerHTML='<div class="ban bad">Impossible de générer le rapport.</div>'}};
  $("#rd").onclick=()=>show("day");$("#rm").onclick=()=>show("month")}

/* ---------- Responsables : un HSE, un Qualité ---------- */
async function mgr(){
  await loadMgr();if(tab!=="mgr")return;
  const card=d=>{const m=MGR[d];return`<div class="card dc" style="border-top:4px solid ${DCOL[d]}"><h2>${DICO[d]} Responsable ${DL[d]}</h2>${m?`<div class="mg" style="margin-top:8px"><div class="who"><b>${esc(m.name)}</b><br><span class="muted">Identifiant : <code>${esc(m.emp_code)}</code></span></div><button class="btn ghost sm" data-a="${m.id}" data-v="${!m.active}"><span class="chip ${m.active?"ok":""}">${m.active?"Actif":"Désactivé"}</span></button></div><div class="row" style="margin-top:12px"><button class="btn ghost sm" data-p="${m.id}">Nouveau PIN</button><button class="btn red sm" data-d="${m.id}">Supprimer</button></div>`:`<p class="muted" style="margin:8px 0 12px">Aucun responsable nommé. Il recevra uniquement les alertes ${d==="hse"?"HSE (feu, fumée, EPI, chute, fuite…)":"qualité (saleté, corps étranger, hygiène, nuisibles…)"} et les échéances de son registre.</p><form class="row" data-f="${d}"><label>Nom<input name="name" required maxlength="60"></label><button class="btn">Créer l’identifiant</button></form>`}</div>`};
  $("#v").innerHTML=`<p class="muted" style="margin-top:16px;max-width:70ch">Un responsable HSE et un responsable qualité par site, pas d’équipe à gérer. Chacun se connecte sur la page d’accueil, onglet « Responsable », avec son identifiant et son code PIN, et ne voit que son domaine.</p><p class="err" id="ae"></p>${note?`<div class="card" style="margin-top:12px;background:#e3f3ea">${note}</div>`:""}<div class="two">${card("hse")}${card("quality")}</div>`;
  document.querySelectorAll("[data-f]").forEach(f=>f.onsubmit=async e=>{e.preventDefault();try{const r=await api("m_staff_add",{name:new FormData(f).get("name"),role:f.dataset.f});note=`Responsable ${DL[f.dataset.f]} créé : identifiant <code>${esc(r.emp_code)}</code> · code PIN <code>${esc(r.pin)}</code><br><span class="muted">Notez le PIN maintenant : il ne sera plus affiché.</span>`;mgr()}catch(x){$("#ae").textContent=x.status===409?"Ce domaine a déjà son responsable.":"Impossible d’ajouter."}});
  document.querySelectorAll("[data-a]").forEach(x=>x.onclick=async()=>{await api("m_staff_edit",{id:x.dataset.a,active:x.dataset.v==="true"});mgr()});
  document.querySelectorAll("[data-p]").forEach(x=>x.onclick=async()=>{const r=await api("m_staff_edit",{id:x.dataset.p,reset_pin:true});note=`Nouveau code PIN : <code>${esc(r.pin)}</code><br><span class="muted">Notez-le maintenant : il ne sera plus affiché.</span>`;mgr()});
  document.querySelectorAll("[data-d]").forEach(x=>x.onclick=async()=>{if(confirm("Supprimer ce responsable ?")){await api("m_staff_del",{id:x.dataset.d});note="";mgr()}})}

/* ---------- Compte ---------- */
async function acc(){const pc=await getPair();if(tab!=="acc")return;$("#v").innerHTML=`<div class="card" style="margin-top:16px;max-width:520px"><h2>Mon compte</h2>${[["Entreprise / site",ME.business_name],["Activité",TYPES[ME.business_type]||ME.business_type],["Ville",ME.city||"—"],["Responsable de l’administration",ME.manager_name],["E-mail",ME.email],["Identifiant du site",`<code>${esc(ME.restaurant_id)}</code>`]].map(([l,v])=>`<p style="margin-top:10px"><span class="muted">${l}</span><br><b>${l.startsWith("Identifiant")?v:esc(v)}</b></p>`).join("")}</div><div class="card" style="margin-top:16px;max-width:520px"><h2>Code d’appairage</h2><p class="muted">Il relie l’application Windows de votre site à votre espace. Ne le partagez pas.</p><p style="margin-top:12px"><code id="pc">${esc(pc||"—")}</code> <button class="btn ghost sm" id="pcc">Copier</button> <button class="btn ghost sm" id="pcn">Nouveau code</button></p><p class="muted" id="pcm" style="margin-top:8px;font-size:13px"></p></div>${(window.VEERO_DOWNLOAD||{}).url?`<div class="card" style="margin-top:16px;max-width:520px"><h2>Application Windows</h2><p class="muted">À installer sur l’ordinateur de votre site. Dans l’application, entrez votre identifiant, le code d’appairage ci-dessus et l’adresse IP de la caméra.</p><p style="margin-top:12px"><a class="btn" href="${esc(window.VEERO_DOWNLOAD.url)}" download>Télécharger l’application pour Windows</a></p></div>`:""}`;
  $("#pcc").onclick=()=>{cp(PAIR);$("#pcm").textContent="Copié."};
  $("#pcn").onclick=async()=>{if(!confirm("Créer un nouveau code ? L’ancien code cessera de fonctionner : il faudra saisir le nouveau dans l’application."))return;try{PAIR=(await api("m_pair_reset",{})).code;$("#pc").textContent=PAIR;$("#pcm").textContent="Nouveau code créé. Saisissez-le dans l’application Windows."}catch{$("#pcm").textContent="Impossible pour l’instant."}}}
function go(t){tab=t;note="";lastRoom="";edit=null;$("#v").classList.remove("still");clearInterval(timer);document.querySelectorAll("#tb button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  if(t==="room"){room();timer=setInterval(room,3000)}else if(t==="reg")reg();else if(t==="rep")rep();else if(t==="mgr")mgr();else acc()}
document.querySelectorAll("#tb button").forEach(b=>b.onclick=()=>go(b.dataset.t));
$("#out").onclick=async()=>{await fetch("/api?op=m_logout",{method:"POST"});location.href="/"};
api("m_me").then(m=>{ME=m;$("#hr").innerHTML=`<h1>Bonjour ${esc(m.manager_name)}</h1><p>${esc(m.business_name)} · ${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</p>`;$("#bn").textContent=m.business_name;$("#bt").textContent=TYPES[m.business_type]||"";go("room")});
</script></body></html>
