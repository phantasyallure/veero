<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Mes alertes — Veero</title><link rel="icon" href="/static/favicon.png"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png"><script src="/static/brand.js"></script><script src="/static/hse.js"></script><meta name="theme-color" content="#102D50"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/site.css">
<style>
.al{background:#fff;border:1px solid var(--line);border-left:7px solid var(--c);border-radius:14px;padding:14px 16px;margin-top:12px}
.al .top{display:flex;align-items:flex-start;gap:12px}.al b{font-size:19px;display:block;line-height:1.25}.al small{color:var(--mute);font-size:14px;display:block;margin-top:2px}
.al em{margin-left:auto;font:700 24px inherit;font-style:normal;font-variant-numeric:tabular-nums}
.al .acts{display:flex;align-items:center;gap:10px;margin-top:10px}.ok{color:var(--ok);font-weight:600;font-size:14px}
.calm{text-align:center;padding:48px 10px;color:var(--mute)}.calm div{font-size:46px;color:var(--ok)}
.dom{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;background:var(--navy)}.dom.hse{background:#b36200}.dom.quality{background:#00817b}
h3.sec{margin:26px 0 4px;font-size:15px}.due{display:flex;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-top:8px}
.due small{color:var(--mute);display:block}.due .d{font-weight:700;white-space:nowrap}.d.expired{color:var(--bad)}.d.soon{color:var(--amber)}
</style></head>
<body><header class="hdr"><b id="rn">Veero</b><span class="sp"></span><span class="dom" id="dm" hidden></span><button class="btn ghost sm" id="out" style="margin-left:10px">Déconnexion</button></header>
<main class="wrap" style="max-width:560px;padding-top:20px"><p class="muted" id="hi"></p><button class="btn ghost sm" id="en" style="margin-top:8px" hidden>🔔 Activer le son et les notifications</button><div id="v"></div><div id="dues"></div></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),mm=s=>{s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
let seen=new Set(),first=true,ctx,busy=false;
const beep=()=>{try{ctx=ctx||new(window.AudioContext||webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.value=.25;o.start();o.stop(ctx.currentTime+.3)}catch{}};
const ping=t=>{navigator.vibrate&&navigator.vibrate([200,100,200]);beep();if("Notification"in window&&Notification.permission==="granted")new Notification("Veero",{body:t})};
if(!("Notification"in window)||Notification.permission!=="granted")$("#en").hidden=false;
$("#en").onclick=async()=>{beep();if("Notification"in window)await Notification.requestPermission();$("#en").hidden=true};
$("#out").onclick=async()=>{await fetch("/api?op=e_logout",{method:"POST"});location.href="/"};
const DOM={hse:"HSE",quality:"Qualité"};
async function ack(id,zone,type){busy=true;try{await fetch("/api?op=e_ack",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,zone,type})})}catch{}busy=false;tick()}
async function tick(){let r;try{r=await fetch("/api?op=e_state")}catch{return}
  if(r.status===401)return location.href="/";
  if(r.status===403){$("#v").innerHTML='<div class="calm"><p>Ce compte n’est pas un compte responsable HSE ou Qualité. Demandez à l’administration de le recréer.</p></div>';return}
  if(!r.ok)return;const s=await r.json();
  $("#rn").textContent=s.restaurant||"Veero";$("#hi").textContent="Bonjour "+s.name;
  const dm=$("#dm");dm.hidden=false;dm.className="dom "+s.role;dm.textContent="Responsable "+DOM[s.role];
  if(!first)s.risks.filter(a=>!seen.has(a.id)).forEach(a=>ping((a.level==="critical"?"CRITIQUE · ":"")+HSE.riskLabel(a.type,"fr")+" — "+a.zone));
  seen=new Set(s.risks.map(a=>a.id));first=false;
  const lv=a=>a.level==="critical"?2:1;
  $("#v").innerHTML=s.risks.length?[...s.risks].sort((a,b)=>lv(b)-lv(a)||b.seconds-a.seconds).map(a=>`<div class="al" style="--c:${a.level==="critical"?"#b3261e":"#d98a1b"}"><div class="top"><div><b>${esc(HSE.riskLabel(a.type,"fr"))}</b><small>${esc(a.zone)}${a.camera?" · "+esc(a.camera):""}${a.detail?" · "+esc(a.detail):""}</small></div><em>${mm(a.seconds)}</em></div><div class="acts">${a.ack?'<span class="ok">✓ Pris en charge</span>':`<button class="btn sm" data-id="${esc(a.id)}" data-z="${esc(a.zone)}" data-t="${esc(a.type)}">Pris en charge</button>`}${a.level==="critical"?'<span style="background:#fde8e6;color:#b3261e;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700">Critique</span>':""}</div></div>`).join(""):`<div class="calm"><div>✓</div><p>Aucun risque ${esc(DOM[s.role]||"")} en cours.</p>${s.online?"":"<p>Système caméra hors ligne.</p>"}</div>`;
  document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>ack(b.dataset.id,b.dataset.z,b.dataset.t));
  $("#dues").innerHTML=s.due.length?`<h3 class="sec">Échéances à traiter</h3>`+s.due.map(a=>`<div class="due"><div><b>${esc(a.name)}</b><small>${esc(HSE.assetLabel(a.category,"fr"))}${a.location?" · "+esc(a.location):""}</small></div><div class="d ${a.state}">${a.days<0?"expiré depuis "+(-a.days)+" j":a.days===0?"aujourd’hui":"dans "+a.days+" j"}</div></div>`).join(""):""}
tick();setInterval(()=>{if(!busy)tick()},3000);
</script></body></html>
